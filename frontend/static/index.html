<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Skill Workout Coach</title>
<!-- Google Fonts & Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --bg: #0b0f19;
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --border: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --user-bubble-bg: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --agent-bubble-bg: #1e293b;
    --glow-shadow: 0 8px 32px rgba(99, 102, 241, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: 
      radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 1rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .brand-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.82rem;
    font-weight: 500;
    color: #34d399;
    background: rgba(52, 211, 153, 0.1);
    border: 1px solid rgba(52, 211, 153, 0.25);
    padding: 0.35rem 0.8rem;
    border-radius: 20px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
  }

  /* Chat Container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.75rem 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  /* Custom Scrollbar */
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  #log::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

  /* Messages & Dialogue Layout */
  .msg {
    display: flex;
    flex-direction: column;
    animation: messageSlide 0.3s ease-out forwards;
    max-width: 85%;
  }
  @keyframes messageSlide {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .sender-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.35rem;
    padding: 0 0.2rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .bubble {
    padding: 0.95rem 1.25rem;
    border-radius: 18px;
    background: var(--agent-bubble-bg);
    border: 1px solid var(--card-border);
    text-align: left;
    white-space: pre-wrap;
    line-height: 1.55;
    color: var(--text-primary);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(8px);
  }
  .msg.user .bubble {
    background: var(--user-bubble-bg);
    color: #ffffff;
    border: none;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 18px rgba(79, 70, 229, 0.35);
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }

  /* When reply is an A2UI card, remove bubble background */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Quick Action Prompts Container */
  .footer-container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1.25rem 1.25rem 1.25rem;
  }

  .prompts-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }
  .prompt-chip {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    padding: 0.55rem 1rem;
    border-radius: 20px;
    font-size: 0.86rem;
    font-weight: 500;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .prompt-chip:hover {
    background: var(--accent);
    border-color: var(--accent-light);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: var(--glow-shadow);
  }

  /* Input Form */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: rgba(30, 41, 59, 0.85);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid transparent;
    border-radius: 12px;
    font-size: 0.98rem;
    background: rgba(15, 23, 42, 0.6);
    color: var(--text-primary);
    transition: all 0.2s ease;
  }
  input::placeholder { color: #64748b; }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(15, 23, 42, 0.9);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }
  button.submit-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.98rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }
  button.submit-btn:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--glow-shadow);
  }

  /* A2UI Component Enhancements */
  .a2card {
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.4rem;
    background: rgba(30, 41, 59, 0.9);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    max-width: 100%;
    color: var(--text-primary);
    backdrop-filter: blur(12px);
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.65rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .a2text.a2-h2 { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; }
  .a2text.a2-h3 { font-size: 1.15rem; font-weight: 600; color: #e2e8f0; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #cbd5e1; }
  .a2text.a2-caption { font-size: 0.88rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--card-border); margin: 0.75rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1px solid var(--card-border); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent-light); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">💪</div>
    <div class="brand-title">IT Skill Workout Coach</div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Agent Active</span>
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <div class="prompts-row">
    <button class="prompt-chip" type="button" data-prompt="ワークアウトタスクの進捗一覧を表示して">📋 ワークアウトタスクの進捗確認</button>
    <button class="prompt-chip" type="button" data-prompt="Antigravity SkillのYAML定義方法を教えて">📚 Antigravity Skillの作成手順</button>
    <button class="prompt-chip" type="button" data-prompt="Agent CLIマスターの達成バッジ画像を生成して">🏆 Agent CLIマスターバッジ生成</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask something..." autocomplete="off" autofocus>
    <button class="submit-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const label = el("div", "sender-label");
  if (who === "user") {
    label.innerHTML = "<span>You</span>";
  } else {
    label.innerHTML = "<span>💪 IT Skill Workout Coach</span>";
  }
  const b = el("div", "bubble");
  m.appendChild(label);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (let m of messages) {
    if (m && m.data) m = m.data;
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (let m of messages) {
    if (m && m.data) m = m.data;
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

document.querySelectorAll(".prompt-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    input.value = chip.dataset.prompt;
    if (typeof form.requestSubmit === "function") {
      form.requestSubmit();
    } else {
      form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
    }
  });
});

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
